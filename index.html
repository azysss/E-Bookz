<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-BOOKZ — Retro Pixel E-Book Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg-primary: #350e6e;
      --bg-secondary: #22064d;
      --accent-yellow: #ffe838;
      --accent-pink: #ff8ad8;
      --accent-cyan: #24d8ff;
      --accent-green: #69c938;
      --pixel-border: #111111;
      --bubble-bg: #ffffff;
      --win-gray: #c0c0c0;
      --win-blue: #0000a8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      image-rendering: pixelated;
    }

    body {
      font-family: 'Press Start 2P', monospace;
      background-color: var(--bg-primary);
      color: #111;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.35s ease;
    }

    /* Pixel Scrollbar */
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
      border-left: 3px solid #111;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--accent-yellow);
      border: 3px solid #111;
    }

    .screen {
      display: none;
      width: 100%;
      min-height: 100vh;
      position: relative;
    }
    .screen.active {
      display: flex;
      flex-direction: column;
    }

    /* =========================================================
       SCREEN 1: LANDING PAGE
    ========================================================= */
    #screen-landing {
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.08), transparent 65%), var(--bg-primary);
    }

    .landing-sky {
      width: 100%;
      max-width: 1180px;
      padding-top: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 5;
    }

    .cloud {
      position: absolute;
      top: 22px;
      pointer-events: none;
    }
    .cloud-left { left: 10px; }
    .cloud-right { right: 10px; }

    .subtitle-top {
      font-size: clamp(14px, 2vw, 22px);
      color: var(--accent-yellow);
      text-shadow: 3px 3px 0 #1b053d, 0 0 12px rgba(255, 232, 56, 0.55);
      letter-spacing: 2px;
      margin-bottom: 18px;
      text-align: center;
    }

    /* Pixel-Grid Dot-Matrix Banner >E-BOOKZ< */
    .matrix-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(4px, 1vw, 10px);
      margin-bottom: 18px;
      padding: 6px;
      flex-wrap: wrap;
    }

    .matrix-glyph {
      display: grid;
      grid-template-columns: repeat(5, clamp(5px, 1.05vw, 11px));
      grid-template-rows: repeat(7, clamp(5px, 1.05vw, 11px));
      gap: 2px;
      background: #9f7be8;
      padding: 4px;
      box-shadow: 0 5px 0 #260854, 0 0 18px rgba(255, 232, 56, 0.25);
    }

    .matrix-glyph.narrow {
      grid-template-columns: repeat(4, clamp(5px, 1.05vw, 11px));
    }

    .m-cell {
      width: 100%;
      height: 100%;
      background: #6741b5;
      border: 1px solid #3c1e78;
    }
    .m-cell.on {
      background: var(--accent-yellow);
      border-color: #c99a00;
      box-shadow: inset 1px 1px 0 #fff8a6;
    }

    .byline {
      font-size: clamp(11px, 1.4vw, 16px);
      color: var(--accent-yellow);
      text-shadow: 2px 2px 0 #1b053d;
      margin-bottom: 18px;
      letter-spacing: 2px;
    }

    /* Sign In Pixel Pill Button */
    .sign-in-wrapper {
      position: relative;
      z-index: 10;
      margin-top: 6px;
    }

    .btn-signin {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(14px, 1.8vw, 22px);
      color: #fff;
      text-shadow: 3px 3px 0 #995500;
      background: linear-gradient(180deg, #ffdd78 0%, #f5b342 65%, #d98a1c 100%);
      border: 4px solid #111;
      padding: 16px 34px;
      cursor: pointer;
      position: relative;
      box-shadow:
        -6px 0 0 0 #55b887,
        6px 0 0 0 #55b887,
        0 6px 0 0 #111,
        0 10px 18px rgba(0, 0, 0, 0.45);
      transition: transform 0.1s steps(2);
    }
    .btn-signin:hover {
      transform: translateY(-2px);
      filter: brightness(1.07);
    }
    .btn-signin:active {
      transform: translateY(3px);
    }

    /* Pixel Cityscape & Bus Scene */
    .landing-scene {
      width: 100%;
      height: 290px;
      position: relative;
      margin-top: auto;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    .landing-scene svg {
      width: 100%;
      max-width: 1360px;
      height: 100%;
      display: block;
    }

    /* =========================================================
       SCREEN 2: WIN95 / RPG SIGN-IN MODAL
    ========================================================= */
    #screen-login {
      justify-content: center;
      align-items: center;
      background-color: var(--bg-primary);
      background-image:
        radial-gradient(rgba(162, 114, 245, 0.32) 2px, transparent 2px),
        radial-gradient(rgba(162, 114, 245, 0.32) 2px, transparent 2px);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
      overflow: hidden;
    }

    .login-dialog-stack {
      position: relative;
      z-index: 10;
      width: min(92vw, 490px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .win95-window {
      width: 100%;
      background: var(--win-gray);
      border: 4px solid #111;
      box-shadow:
        inset 4px 4px 0 #ffffff,
        inset -4px -4px 0 #7a7a7a,
        0 10px 0 rgba(0, 0, 0, 0.35);
    }

    .win95-titlebar {
      background: linear-gradient(90deg, #00009c, #1836d1);
      color: #fff;
      text-align: center;
      padding: 12px 10px;
      font-size: clamp(13px, 1.8vw, 18px);
      letter-spacing: 1px;
      border-bottom: 4px solid #111;
      text-shadow: 2px 2px 0 #000;
    }

    .win95-body {
      padding: 22px 28px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .rpg-field-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .rpg-label {
      font-size: 13px;
      color: #fff;
      text-shadow:
        -2px -2px 0 #111,
         2px -2px 0 #111,
        -2px  2px 0 #111,
         2px  2px 0 #111;
      letter-spacing: 1px;
    }

    .heart-bar-wrapper {
      width: 100%;
      max-width: 340px;
      display: flex;
      align-items: center;
      position: relative;
    }

    .pixel-heart-icon {
      width: 44px;
      height: 40px;
      flex-shrink: 0;
      z-index: 3;
      margin-right: -10px;
    }

    .heart-input-track {
      flex: 1;
      height: 30px;
      background: #9c8ba8;
      border: 4px solid #2b2238;
      border-radius: 0 12px 12px 0;
      display: flex;
      align-items: center;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 3px 0 rgba(0,0,0,0.25);
    }

    .heart-fill {
      width: 34px;
      height: 100%;
      background: #f05a30;
      border-right: 3px solid #2b2238;
      flex-shrink: 0;
      transition: width 0.25s ease;
    }

    .heart-input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 0 10px;
      text-shadow: 1px 1px 0 #111;
    }
    .heart-input::placeholder {
      color: rgba(255, 255, 255, 0.55);
      font-size: 9px;
    }

    .win95-buttons {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 6px;
    }

    .btn-win95 {
      font-family: 'VT323', monospace;
      font-size: 28px;
      font-weight: bold;
      color: #111;
      background: var(--win-gray);
      border: 4px solid #111;
      padding: 8px 16px;
      cursor: pointer;
      box-shadow:
        inset 4px 4px 0 #ffffff,
        inset -4px -4px 0 #7a7a7a;
    }
    .btn-win95:hover {
      background: #d4d4d4;
    }
    .btn-win95:active {
      box-shadow:
        inset -3px -3px 0 #ffffff,
        inset 3px 3px 0 #7a7a7a;
      transform: translateY(2px);
    }

    .login-characters-under {
      margin-top: -6px;
      z-index: 4;
      pointer-events: none;
    }

    .login-floor {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 68px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
    }

    /* =========================================================
       SCREEN 3: MAIN DASHBOARD
    ========================================================= */
    #screen-dashboard {
      background-color: var(--bg-primary);
      padding: 16px 22px 64px;
      justify-content: flex-start;
      overflow-x: hidden;
    }

    /* Top HUD Bar */
    .hud-header {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      position: relative;
      z-index: 20;
    }

    .profile-hud {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .avatar-ring {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 4px solid var(--accent-yellow);
      background: #2b1254;
      box-shadow: 0 0 0 4px #111;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      z-index: 3;
      flex-shrink: 0;
    }
    .avatar-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: auto;
    }
    .avatar-ring:hover::after {
      content: 'EDIT';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      color: var(--accent-yellow);
      font-size: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rpg-name-bar {
      display: flex;
      align-items: center;
      height: 36px;
      margin-left: -8px;
      background: #776c8a;
      border: 4px solid #2b2238;
      border-radius: 0 10px 10px 0;
      padding-right: 12px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
    }

    .rpg-name-fill {
      height: 100%;
      background: var(--accent-green);
      border-right: 4px solid #2b2238;
      display: flex;
      align-items: center;
      padding: 0 16px 0 18px;
    }

    #hud-username {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 #1f4d10;
      width: 120px;
      text-transform: uppercase;
    }

    /* Top-Right Action Icons */
    .hud-actions {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .hud-action-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #fff;
      font-family: 'VT323', monospace;
      font-size: 15px;
      text-shadow: 2px 2px 0 #111;
      transition: transform 0.12s steps(2);
    }
    .hud-action-btn:hover {
      transform: translateY(-3px);
      color: var(--accent-yellow);
    }

    .hud-icon-box {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Dashboard Main Two-Column Grid */
    .dashboard-grid {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.55fr 0.95fr;
      gap: 28px;
      align-items: start;
      position: relative;
      z-index: 10;
    }

    @media (max-width: 960px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    .left-shelves, .right-panels {
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    /* Pixel Speech Bubble Container */
    .pixel-bubble {
      background: var(--bubble-bg);
      border: 6px solid #111;
      box-shadow:
        0 8px 0 #111,
        inset 0 0 0 4px #f2f2f2;
      padding: 20px 22px 22px;
      position: relative;
      color: #111;
    }

    /* Speech Bubble Pointers */
    .bubble-tail-left::before {
      content: '';
      position: absolute;
      top: 14px;
      left: -24px;
      width: 0;
      height: 0;
      border-top: 12px solid #111;
      border-left: 24px solid transparent;
    }
    .bubble-tail-left::after {
      content: '';
      position: absolute;
      top: 18px;
      left: -13px;
      width: 0;
      height: 0;
      border-top: 7px solid #fff;
      border-left: 14px solid transparent;
    }

    .bubble-tail-right::before {
      content: '';
      position: absolute;
      top: 22px;
      right: -24px;
      width: 0;
      height: 0;
      border-top: 12px solid #111;
      border-right: 24px solid transparent;
    }
    .bubble-tail-right::after {
      content: '';
      position: absolute;
      top: 26px;
      right: -13px;
      width: 0;
      height: 0;
      border-top: 7px solid #fff;
      border-right: 14px solid transparent;
    }

    .bubble-tail-music::before {
      content: '';
      position: absolute;
      top: 24px;
      left: -24px;
      width: 0;
      height: 0;
      border-top: 12px solid #111;
      border-left: 24px solid transparent;
    }
    .bubble-tail-music::after {
      content: '';
      position: absolute;
      top: 28px;
      left: -13px;
      width: 0;
      height: 0;
      border-top: 7px solid #fff;
      border-left: 14px solid transparent;
    }

    /* Running Hero Sprite sitting on top of In Progress */
    .runner-sprite {
      position: absolute;
      top: -54px;
      left: 52%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    /* Cat Sprite sitting on top of Favourite Book */
    .cat-sprite {
      position: absolute;
      top: -38px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .bubble-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .bubble-title {
      font-family: 'VT323', monospace;
      font-size: 30px;
      font-weight: bold;
      color: #111;
      letter-spacing: 1px;
    }

    .shelf-carousel {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .shelf-arrow {
      background: transparent;
      border: none;
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      color: #111;
      cursor: pointer;
      padding: 8px 4px;
      user-select: none;
    }
    .shelf-arrow:hover {
      color: var(--bg-primary);
      transform: scale(1.15);
    }

    .cards-row {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      min-height: 190px;
    }

    @media (max-width: 640px) {
      .cards-row {
        grid-template-columns: 1fr;
      }
    }

    /* Book Card Styling */
    .book-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .book-cover-box {
      width: 100%;
      aspect-ratio: 3 / 3.7;
      border-radius: 14px;
      border: 3px solid #222;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      background: linear-gradient(180deg, #b8e4ff 0%, #e6f6ff 62%, #74a626 62%, #63941c 100%);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
      transition: transform 0.15s steps(2);
    }
    .book-cover-box:hover {
      transform: translateY(-4px);
    }

    .book-cover-box canvas,
    .book-cover-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Placeholder landscape art inside empty/default book card */
    .placeholder-art {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    .placeholder-cloud {
      position: absolute;
      top: 18%;
      left: 34%;
      width: 44%;
      height: 20%;
      background: #fff;
      border-radius: 20px;
    }
    .placeholder-cloud::before {
      content: '';
      position: absolute;
      top: -45%;
      left: 18%;
      width: 52%;
      height: 95%;
      background: #fff;
      border-radius: 50%;
    }
    .placeholder-hill-back {
      position: absolute;
      bottom: 0;
      right: -15%;
      width: 85%;
      height: 36%;
      background: #8cc232;
      border-radius: 50% 50% 0 0;
    }
    .placeholder-hill-front {
      position: absolute;
      bottom: 0;
      left: -12%;
      width: 88%;
      height: 44%;
      background: #6fa31e;
      border-radius: 50% 65% 0 0;
    }

    .book-badge-fav {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(17, 17, 17, 0.82);
      color: var(--accent-yellow);
      border: 2px solid var(--accent-yellow);
      font-size: 11px;
      padding: 3px 5px;
      cursor: pointer;
      z-index: 4;
    }

    .book-badge-del {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(185, 28, 28, 0.92);
      color: #fff;
      border: 2px solid #111;
      font-size: 10px;
      padding: 3px 5px;
      cursor: pointer;
      z-index: 4;
      box-shadow: 1px 1px 0 #111;
    }
    .book-badge-del:hover {
      background: #ef4444;
      transform: scale(1.08);
    }

    .btn-card-fav {
      width: 100%;
      font-family: 'VT323', monospace;
      font-size: 15px;
      font-weight: bold;
      padding: 2px 6px;
      border: 2px solid #111;
      background: #f3f4f6;
      color: #111;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 2px 2px 0 #111;
    }
    .btn-card-fav:hover {
      background: #fef08a;
    }
    .btn-card-fav.is-fav {
      background: var(--accent-yellow);
      color: #111;
    }

    .book-progress-pill {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(17, 17, 17, 0.85);
      color: #fff;
      font-family: 'VT323', monospace;
      font-size: 14px;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .book-title-input {
      width: 100%;
      font-family: 'VT323', monospace;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      color: #111;
      background: transparent;
      border: 2px dashed transparent;
      padding: 2px 4px;
      outline: none;
    }
    .book-title-input:hover,
    .book-title-input:focus {
      border-color: #111;
      background: #fffbe0;
    }

    .book-stars {
      display: flex;
      gap: 2px;
      font-size: 12px;
      cursor: pointer;
    }
    .star-btn {
      color: #ccc;
      transition: color 0.1s;
    }
    .star-btn.filled {
      color: #f59e0b;
      text-shadow: 1px 1px 0 #111;
    }

    /* Right Top: Favourite Book Bubble */
    .fav-bubble-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .crown-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2px;
    }

    .fav-card-slot {
      width: 155px;
    }

    /* Right Bottom: Music Player Bubble + Girl & Dog Sprites */
    .music-area-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      position: relative;
    }

    .girl-dog-companion {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: -14px;
    }

    .music-bubble {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 16px 14px;
    }

    .music-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 10px 0 12px;
    }

    .music-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 4px solid #111;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      box-shadow: 0 3px 0 #111;
    }
    .music-btn.play-main {
      width: 56px;
      height: 56px;
      font-size: 16px;
    }
    .music-btn:hover {
      background: var(--accent-yellow);
    }
    .music-btn:active {
      transform: translateY(2px);
    }

    .track-title-display {
      font-family: 'VT323', monospace;
      font-size: 22px;
      font-weight: bold;
      color: #111;
      width: 100%;
      text-align: center;
      background: transparent;
      border: 2px dashed transparent;
      outline: none;
      padding: 2px 6px;
      cursor: text;
    }
    .track-title-display:hover,
    .track-title-display:focus {
      border-color: #111;
      background: #fffbe0;
    }

    .playlist-toggle-link {
      margin-top: 6px;
      font-family: 'VT323', monospace;
      font-size: 16px;
      color: #4b1d96;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
    }

    /* Dashboard Decorative Side Buildings & Bottom Brick Ground */
    .dash-building-left {
      position: fixed;
      left: 0;
      bottom: 42px;
      width: 78px;
      height: 360px;
      pointer-events: none;
      z-index: 2;
      opacity: 0.92;
    }
    .dash-building-right {
      position: fixed;
      right: 0;
      bottom: 42px;
      width: 78px;
      height: 360px;
      pointer-events: none;
      z-index: 2;
      opacity: 0.92;
    }
    .dash-brick-floor {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 44px;
      background-color: #b56576;
      background-image:
        linear-gradient(335deg, #e5989b 23px, transparent 23px),
        linear-gradient(155deg, #e5989b 23px, transparent 23px),
        linear-gradient(335deg, #e5989b 23px, transparent 23px),
        linear-gradient(155deg, #e5989b 23px, transparent 23px);
      background-size: 58px 28px;
      background-position: 0 2px, 4px 16px, 29px 16px, 34px 2px;
      border-top: 4px solid #111;
      z-index: 3;
      pointer-events: none;
    }

    /* =========================================================
       MODALS (THEME, MUSIC/VIDEO CONVERTER, PDF READER)
    ========================================================= */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(12, 4, 28, 0.82);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-backdrop.open {
      display: flex;
    }

    .pixel-modal {
      background: var(--win-gray);
      border: 4px solid #111;
      box-shadow:
        inset 4px 4px 0 #fff,
        inset -4px -4px 0 #7a7a7a,
        0 12px 0 rgba(0, 0, 0, 0.5);
      width: min(94vw, 560px);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pixel-modal-header {
      background: var(--win-blue);
      color: #fff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      border-bottom: 4px solid #111;
    }

    .btn-close-x {
      background: var(--win-gray);
      border: 3px solid #111;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 4px 7px;
      cursor: pointer;
      box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 #7a7a7a;
    }

    .pixel-modal-body {
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-family: 'VT323', monospace;
      font-size: 20px;
    }

    .theme-swatches {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .swatch-btn {
      padding: 12px 8px;
      border: 4px solid #111;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      text-shadow: 2px 2px 0 #111;
      cursor: pointer;
      text-align: center;
    }

    .playlist-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border: 3px solid #111;
      padding: 8px 10px;
      gap: 8px;
    }
    .playlist-item.active-track {
      background: #fff7b8;
      border-color: #d97706;
    }

    .playlist-title-input {
      flex: 1;
      font-family: 'VT323', monospace;
      font-size: 20px;
      font-weight: bold;
      color: #111;
      background: transparent;
      border: 2px dashed transparent;
      padding: 2px 6px;
      outline: none;
    }
    .playlist-title-input:hover,
    .playlist-title-input:focus {
      border-color: #111;
      background: #ffffff;
    }

    .mini-pixel-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      padding: 6px 10px;
      border: 3px solid #111;
      background: var(--accent-yellow);
      cursor: pointer;
      box-shadow: 2px 2px 0 #111;
    }
    .mini-pixel-btn:hover {
      filter: brightness(1.06);
    }

    /* =========================================================
       CONTINUOUS SCROLLABLE PDF READER OVERLAY
    ========================================================= */
    #reader-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #1a0b36;
      z-index: 200;
      flex-direction: column;
    }
    #reader-overlay.open {
      display: flex;
    }

    .reader-toolbar {
      background: var(--win-gray);
      border-bottom: 4px solid #111;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 10;
    }

    .reader-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .reader-title-edit {
      font-family: 'VT323', monospace;
      font-size: 22px;
      font-weight: bold;
      padding: 4px 8px;
      border: 3px solid #111;
      background: #fff;
      width: 220px;
    }

    .tool-chip {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      padding: 7px 10px;
      border: 3px solid #111;
      background: #fff;
      cursor: pointer;
      box-shadow: 2px 2px 0 #111;
    }
    .tool-chip.active {
      background: var(--accent-yellow);
    }
    .tool-chip.finish-btn {
      background: var(--accent-green);
      color: #fff;
      text-shadow: 1px 1px 0 #111;
    }

    .reader-scroll-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      position: relative;
      background: #231442;
      transition: filter 0.25s ease, background-color 0.25s ease;
    }

    /* Reading Filters */
    .reader-scroll-viewport.filter-normal {
      filter: none;
      background: #231442;
    }
    .reader-scroll-viewport.filter-sepia {
      filter: sepia(0.55) brightness(0.96);
      background: #3b2d1f;
    }
    .reader-scroll-viewport.filter-warm {
      filter: sepia(0.28) saturate(1.15) contrast(0.96);
      background: #2e2236;
    }
    .reader-scroll-viewport.filter-night {
      filter: invert(0.88) hue-rotate(180deg);
      background: #e8e8e8;
    }
    .reader-scroll-viewport.filter-highcontrast {
      filter: contrast(1.3) grayscale(0.2);
      background: #111;
    }

    .pdf-page-wrapper {
      position: relative;
      background: #fff;
      border: 4px solid #111;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.55);
      max-width: 100%;
    }

    .pdf-page-wrapper canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }

    /* Interactive Text Layer for Sentence/Line Highlighting */
    .pdf-text-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      line-height: 1;
    }

    .pdf-text-span {
      position: absolute;
      color: transparent;
      white-space: pre;
      cursor: pointer;
      transform-origin: 0% 0%;
      border-radius: 2px;
      transition: background-color 0.12s;
    }

    .reader-scroll-viewport.mark-mode .pdf-text-span:hover {
      background-color: rgba(255, 232, 56, 0.45);
      outline: 2px dashed #d97706;
    }

    .pdf-text-span.last-read-highlight {
      background-color: rgba(255, 232, 56, 0.62) !important;
      border-bottom: 3px solid #ef4444;
      box-shadow: 0 0 8px rgba(255, 232, 56, 0.9);
    }

    /* Custom Horizontal Bookmark Line Marker */
    .last-line-bookmark-bar {
      position: absolute;
      left: 0;
      right: 0;
      height: 6px;
      background: rgba(255, 59, 92, 0.85);
      border-top: 2px solid #111;
      border-bottom: 2px solid #111;
      pointer-events: none;
      z-index: 6;
      display: flex;
      align-items: center;
    }
    .last-line-bookmark-tag {
      background: #ff3b5c;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      padding: 3px 6px;
      border: 2px solid #111;
      margin-left: 8px;
      transform: translateY(-12px);
      text-shadow: 1px 1px 0 #111;
    }

    .toast-banner {
      position: fixed;
      bottom: 58px;
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      color: var(--accent-yellow);
      border: 3px solid var(--accent-yellow);
      padding: 10px 18px;
      font-size: 10px;
      z-index: 500;
      display: none;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
